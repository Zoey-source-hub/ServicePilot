<html lang="zh-CN">

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ServicePilot · 问题处理工作台</title>
<style>
:root{--ink:#253338;--muted:#6e7a80;--line:#dce2e4;--bg:#f3f5f6;--teal:#24645d;--light:#eaf3f0;--red:#aa514b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft Yahei',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:5px;padding:9px 15px;background:white;color:var(--ink)}button:hover{border-color:var(--teal);background:var(--light)}button:disabled{opacity:.4;cursor:not-allowed}button.primary{background:var(--teal);color:white;border-color:var(--teal)}button.danger{color:var(--red)}:focus-visible{outline:3px solid #92bdb4;outline-offset:3px}header{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.brand{font:700 23px Georgia,serif;letter-spacing:-.6px}.brand span{color:var(--teal)}.badge{font-size:12px;padding:4px 9px;background:var(--light);color:var(--teal);border-radius:4px}.red{background:#faeeec;color:var(--red)}.shell{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 70px)}aside{padding:30px 20px;background:#edf1f2;border-right:1px solid var(--line)}aside button{width:100%;text-align:left;background:var(--ink);color:white;border:0;margin:14px 0}.small,small{font-size:12px;color:var(--muted)}main{padding:30px 38px;max-width:1480px;width:100%;margin:auto}h1{font-size:26px;line-height:1.4;margin:8px 0 12px;letter-spacing:-.6px}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0 0 12px}p{margin:8px 0 16px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.panel{background:white;border:1px solid var(--line);border-radius:7px;padding:24px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid .panel{margin:0}.notice{border-left:3px solid var(--teal);background:var(--light);padding:12px 16px;margin:18px 0}.stats{display:flex;gap:44px;margin:25px 0}.stats strong{display:block;font:32px Georgia,serif}.stats span{color:var(--muted);font-size:12px}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:15px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:500}nav{display:flex;border-bottom:1px solid var(--line);gap:8px;margin:25px 0}nav button{border:0;background:none;border-radius:0;padding:13px 16px;color:var(--muted)}nav .active{color:var(--teal);border-bottom:3px solid var(--teal);font-weight:600}.quote{padding:18px;background:#f5f7f8;border:1px solid var(--line);margin:14px 0}.quote.error{border-left:3px solid var(--red)}.quote.correct{border-left:3px solid var(--teal)}label{display:block;margin:12px 0 5px}textarea,input,select{border:1px solid #cbd4d8;border-radius:4px;padding:9px;background:white;color:var(--ink)}textarea{width:100%;min-height:100px;resize:vertical}input[type=text]{width:100%}input[type=checkbox]{margin-right:8px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.case-layout{display:grid;grid-template-columns:235px 1fr;gap:20px}.case-list{max-height:525px;overflow:auto;padding-right:8px}.case-list button{width:100%;text-align:left;margin:0 0 7px;font-size:12px}.case-list button.selected{border-color:var(--teal);background:var(--light)}details{margin:12px 0}summary{cursor:pointer;color:var(--teal)}.diff-old{background:#fcf1ef;border-left:3px solid var(--red);padding:20px;white-space:pre-wrap}.diff-new{background:var(--light);padding:20px;border-left:3px solid var(--teal);white-space:pre-wrap}.step-note{color:var(--muted);margin:0 0 20px}.log{font-size:12px;border-left:2px solid var(--line);padding-left:18px;margin:15px 0}.footer{font-size:12px;color:var(--muted);margin-top:28px}#toast{position:fixed;bottom:25px;right:25px;background:var(--ink);color:white;border-radius:6px;padding:14px 20px;max-width:90vw;display:none;z-index:10}dialog{border:1px solid var(--line);border-radius:8px;max-width:480px;padding:28px}dialog::backdrop{background:#25333866}@media(max-width:900px){.shell{grid-template-columns:1fr}aside{display:none}main{padding:20px}.grid{grid-template-columns:1fr}.case-layout{grid-template-columns:1fr}.case-list{max-height:180px}nav{overflow:auto}nav button{white-space:nowrap;padding:12px 8px}header{padding:0 20px}.stats{gap:25px}.table-wrap{overflow:auto}}
</style>
<header><div class="brand">Service<span>Pilot</span></div><div class="row"><span class="badge">交互原型 · 全部模拟数据</span><button onclick="askReset()">重置演示</button></div></header>
<div class="shell"><aside><div class="small">质量运营 / WORKSPACE</div><button onclick="goList()">▤　问题簇列表</button><p class="small">从证据到修复<br>每一个判断都有依据。</p><div class="footer">演示操作员：林晓<br>无生产系统连接<br>状态仅保存在当前浏览器</div></aside><main id="app"></main></div>
<div id="toast" role="status"></div><dialog id="modal"><h2 id="modalTitle"></h2><p id="modalText"></p><div id="modalFields"></div><div class="actions"><button onclick="document.querySelector('dialog').close()">取消</button><button class="primary" id="modalConfirm">确认</button></div></dialog>
<script>
const OLD='耳机 A 支持 Qi 无线充电，可直接放置在兼容的无线充电板上。支持 USB-C 有线充电。';
const NEW='耳机 A 不支持无线充电，仅支持 USB-C 有线充电。请使用 USB-C 充电线连接电源，不要使用 Qi 无线充电板。';
const initial=()=>({cluster:'待确认',cases:{},reasons:{},analysis:false,draft:NEW,revision:1,approved:0,reviewer:'',reviewNote:'',result:null,released:false,rollback:false,logs:[]});
let s;try{s=JSON.parse(localStorage.getItem('servicepilot-v1'))||initial()}catch{s=initial()}
let page='list',step=0,selected=0,filter='all',busy=false,scenario='pass',runToken=0;
const $=id=>document.getElementById(id);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const count=v=>Object.values(s.cases).filter(x=>x===v).length;
const pending=()=>50-Object.keys(s.cases).length;
const scenarios={pass:{target:20,neighbor:10,label:'验证通过'},fail:{target:18,neighbor:10,label:'目标验证失败'},regression:{target:20,neighbor:9,label:'邻近回归退化'}};
if(s.result && s.result.target===undefined){s.result={...s.result,target:s.result.pass?20:18,neighbor:10,scenario:s.result.pass?'pass':'fail'}}
const meetsGate=r=>!!r&&r.target/20>=.95&&r.neighbor===10;
const canPublish=()=>!s.released&&!busy&&s.cluster==='已确认'&&s.approved===s.revision&&s.result?.rev===s.revision&&meetsGate(s.result);
const status=()=>s.released?'线上观察中':s.cluster==='误报'?'已关闭 · 误报':busy?'验证中':s.result?(meetsGate(s.result)?'待发布':s.result.neighbor<10?'回归退化 · 待修复':'验证失败 · 待修复'):s.approved?'待验证':s.analysis?(s.rollback?'已回滚 · 待重新审批':'待审批'):s.rollback?'已回滚 · 待修复':s.cluster==='已确认'?'待修复':s.cluster==='待补充证据'?'待补充证据':'待确认';
function trackCases(value){filter=value;selected=Array.from({length:50},(_,i)=>i).find(i=>value==='other'?i>=42:!s.cases[i])??0;page='detail';step=0;render()}
function save(){try{localStorage.setItem('servicepilot-v1',JSON.stringify(s))}catch{toast('浏览器未允许保存；当前页面仍可演示。')}}
function log(t){s.logs.unshift({time:new Date().toLocaleTimeString('zh-CN',{hour12:false}),text:t});save()}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}
function confirmAction(title,text,fn){$('modalFields').innerHTML='';$('modalConfirm').textContent='确认';$('modalTitle').textContent=title;$('modalText').textContent=text;$('modalConfirm').onclick=()=>{$('modal').close();fn()};$('modal').showModal()}
function askReset(){confirmAction('重置本机演示？','将清空本浏览器中的核验、审批与发布记录，恢复 50 条待核验案例。',()=>{runToken++;s=initial();page='list';step=0;selected=0;busy=false;save();render()})}
function goList(){page='list';render()}
function openIssue(){page='detail';step=0;render()}
function invalidate(){s.approved=0;s.result=null;s.reviewer='';s.reviewNote=''}
function header(){return `<div class="row between"><button onclick="goList()">← 问题簇列表</button><span class="small">ISS-1024 / 首次发现 2026-10-10</span></div><h1>耳机 A 无线充电功能错误</h1><div class="row"><span class="badge red">高风险</span><span class="badge">50 条聚类</span><span class="badge">问题簇：${s.cluster}</span><span class="badge">实际处理状态：${status()} · 模拟</span></div><p class="small">当前查看：${['证据核验','根因分析','FAQ 修复','人工审批','验证与发布'][step]}。切换步骤仅浏览页面，不改变处理状态。</p><nav>${['证据核验','根因分析','FAQ 修复','人工审批','验证与发布'].map((t,i)=>`<button class="${step===i?'active':''}" onclick="step=${i};render()">${i+1}　${t}</button>`).join('')}</nav>`}
function list(){return `<div class="small">质量运营 / 问题簇</div><h1>把重复错误，变成一次有效修复。</h1><p class="step-note">优先核查影响用户决策的知识问题。</p><div class="stats"><div><strong>01</strong><span>待跟进问题簇（模拟）</span></div><div><strong>50</strong><span>聚类对话 · 非确认错误数</span></div><div><strong>${count('确认错误')}</strong><span>人工已确认错误案例</span></div></div><div class="panel"><div class="row between"><h2>问题簇列表</h2><div class="row"><select aria-label="风险筛选" onchange="$('issueRow').hidden=this.value==='low';$('empty').hidden=this.value!=='low'"><option value="all">全部风险</option><option value="high">高风险</option><option value="low">低风险</option></select><span class="small">按影响对话数降序 · 共 1 簇</span></div></div><div class="table-wrap"><table><thead><tr><th>问题 / 风险</th><th>影响范围</th><th>簇确认 / 处理状态</th><th></th></tr></thead><tbody><tr id="issueRow"><td><strong>耳机 A 无线充电功能错误</strong><br><span class="small">ISS-1024 · 商品功能描述错误</span><br><span class="badge red">高风险 · 可能误导购买</span></td><td>50 条聚类<br><span class="small">42 条引用 FAQ-017 v1</span></td><td>${s.cluster}<br><span class="small">${status()}</span></td><td><button class="primary" onclick="openIssue()">查看问题簇 →</button></td></tr></tbody></table></div><p id="empty" hidden>没有符合该风险条件的问题簇。</p></div><div class="notice">聚类只表示相似线索。问题簇确认、单条事实核验和修复验证分别记录，不相互替代。</div>`}
function evidence(){let i=selected,known=i<42,claim=known?'这款耳机支持 Qi 无线充电，您可以直接放在无线充电板上。':i<46?'耳机 A 可以使用无线充电板充电。':i<48?'耳机 A 不支持无线充电，只支持 USB-C。':i===48?'这款支持无线充电。':'耳机 A 支持无线充电。';let ai=i<46?'证据反驳':i<48?'证据支持':i===48?'证据不足':'证据冲突';return `<p class="step-note">单条案例核验与问题簇确认独立记录。确认系统性问题后可继续修复，其余案例仍保持未核验；发布后也可继续核验。</p><div class="row"><span class="badge">确认错误 ${count('确认错误')}</span><span class="badge">误报 ${count('误报')}</span><span class="badge">证据不足 ${count('证据不足')}</span><span class="badge">证据冲突 ${count('证据冲突')}</span><span class="badge">待核验 ${pending()}</span></div><div class="panel case-layout"><div><h3>聚类中的 50 条案例</h3><select aria-label="案例筛选" onchange="filter=this.value;selected=Array.from({length:50},(_,i)=>i).find(i=>filter==='all'||filter==='pending'&&!s.cases[i]||filter==='other'&&i>=42)??0;render()"><option value="all" ${filter==='all'?'selected':''}>全部案例</option><option value="pending" ${filter==='pending'?'selected':''}>待核验</option><option value="other" ${filter==='other'?'selected':''}>非 FAQ 引用案例（8 条）</option></select><div class="case-list" style="margin-top:14px">${Array.from({length:50},(_,j)=>j).filter(j=>filter==='all'||filter==='pending'&&!s.cases[j]||filter==='other'&&j>=42).map(j=>`<button class="${j===i?'selected':''}" onclick="selected=${j};render()">会话 #${1024+j}　${j<42?'FAQ 引用':'其他线索'}<br><span class="small">${s.cases[j]||'待核验'}</span></button>`).join('')||'<p>没有待核验案例。</p>'}</div></div><div><div class="row between"><h2>会话 #${1024+i}</h2><span class="badge">AI 初判：${ai} · 模拟</span></div><div class="grid"><section><h3>客服声明</h3><div class="quote error">${claim}</div><details><summary>查看原始会话与引用轨迹</summary><p>用户：${i===48?'这款耳机能无线充电吗？':'耳机 A 能放在 Qi 充电板上充电吗？'}</p><p>客服：${claim}</p><p class="small">模拟会话 · 2026-10-10<br>产品标识：${i===48?'缺失，无法确定具体型号':'A / 中国大陆版本'}<br>检索引用：${known?'FAQ-017 v1，第 3 段':i===49?'促销资料 v3 与产品说明书 V2，内容冲突':'无 FAQ-017 引用记录'}</p>${known?`<p>被引用原文：${OLD}</p>`:''}</details></section><section><h3>权威证据（模拟资料）</h3><div class="quote correct">耳机 A 不支持无线充电，仅支持 USB-C 有线充电。</div><div class="small">文档名：耳机 A 产品说明书<br>版本：V2 · 生效日期：2026-09-01<br>适用型号：A / 中国大陆<br>证据出处：模拟官方产品资料 · 第 12 页 §3.2「充电」</div><details><summary>查看原始文档与适用范围</summary><p>产品说明书 V2 · 第 12 页 §3.2 充电</p><p>适用型号：A；地区：中国大陆；生效：2026-09-01；来源：模拟官方产品资料。</p><p>充电方式：USB-C。有线连接电源后，指示灯亮起。本型号不配备无线充电线圈，不支持 Qi 无线充电。</p></details>${i===49?'<div class="notice">另有模拟促销资料 v3 声称支持 Qi，适用型号待澄清。先保留冲突，不能自动判定。</div>':''}</section></div><label for="caseReason">本条核验依据 / 备注</label><textarea id="caseReason" placeholder="例如：型号一致，说明书 V2 明确否认 Qi 充电。">${esc(s.reasons[i]||'')}</textarea><div class="actions">${['确认错误','误报','证据不足','证据冲突'].map(v=>`<button class="${v==='确认错误'?'primary':''}" onclick="judge('${v}')">${v}</button>`).join('')}</div><p class="small">当前人工结论：${s.cases[i]||'待核验'}。标记误报表示本条未构成该类错误。</p></div></div><div class="panel"><h2>问题簇确认 · 独立决策</h2><p>基于至少一条人工确认错误的样本，独立确认系统性问题并进入修复，不批量确认其他案例。发布后的核验不改变已发布版本；若新证据推翻原判断，请评估回滚。</p><label for="clusterReason">簇判断理由</label><input id="clusterReason" type="text" placeholder="例如：已核验样本与说明书矛盾，值得修复共同知识源。"><div class="actions"><button class="primary" ${!count('确认错误')||s.released?'disabled':''} onclick="clusterDecision('已确认')">确认簇级问题并继续修复</button><button ${s.released?'disabled':''} onclick="clusterDecision('待补充证据')">待补充证据</button><button class="danger" ${s.released?'disabled':''} onclick="clusterDecision('误报')">整簇标记误报</button></div>${!count('确认错误')?'<p class="small">推进条件：至少一条案例经人工确认错误。</p>':''}</div>`}
function judge(v){let reason=$('caseReason').value.trim();if(!reason)return toast('请先填写本条核验依据。');s.cases[selected]=v;s.reasons[selected]=reason;log(`会话 #${1024+selected}：${v}；${reason}`);render();toast('已保存本条结论；其他案例未变更。')}
function clusterDecision(v){if(s.released)return;let reason=$('clusterReason').value.trim();if(!reason)return toast('请填写问题簇判断理由。');if(v==='已确认'&&!count('确认错误'))return;if(v==='误报'&&count('确认错误'))return toast('簇内仍有确认错误案例，请先复核这些案例再关闭整簇。');s.cluster=v;if(v!=='已确认'){s.analysis=false;invalidate()}log(`问题簇${v}：${reason}`);if(v==='已确认')step=1;render()}
function showAnalysis(){if(s.cluster!=='已确认')return;const existing=s.analysis;if(!existing){s.analysis=true;log('生成模拟根因分析：42 条引用错误 FAQ，8 条另查')}render();const results=$('analysisResults');if(results){results.focus({preventScroll:true});results.scrollIntoView({block:'start',behavior:'smooth'})}toast(existing?'已定位到下方模拟分析结果；这是已生成的固定演示内容。':'模拟分析已生成；下方展示根因与待排查分支。')}
function analysis(){return `<p class="step-note">解释共同根因，保留尚未证实的分支。</p><div class="panel"><h2>AI 根因分析 <span class="badge">预设模拟输出</span></h2><p>依据：50 条聚类对话的检索轨迹、FAQ-017 v1、产品说明书 V2。</p><button class="primary" ${s.cluster!=='已确认'?'disabled':''} onclick="showAnalysis()">${s.analysis?'查看已生成的模拟分析 ↓':'生成模拟根因分析'}</button>${s.cluster!=='已确认'?'<p class="small">请先确认问题簇。</p>':''}</div>${s.analysis?`<div id="analysisResults" class="grid" tabindex="-1" role="region" aria-label="模拟根因分析结果"><div class="panel"><span class="small">主要线索 / 42 OF 50</span><h2>错误知识源被重复引用</h2><p>42 条轨迹引用 FAQ-017 v1，其“支持 Qi”与说明书直接矛盾。优先修复该 FAQ。</p><div class="notice">引用关系不等于 42 条已核验；当前人工确认错误 ${count('确认错误')} 条。</div><p class="small">根因假设：知识库内容错误。可信度：高（演示判断）。</p></div><div class="panel"><span class="small">待排查 / 8 OF 50</span><h2>没有同一错误 FAQ 引用</h2><p>4 条错误声明来源待查；2 条正确回答疑似误聚类；1 条型号缺失；1 条资料冲突。</p><p class="small">以上为模拟 AI 初判，不是人工核验结果。FAQ 修复不能承诺覆盖这 8 条。</p></div></div><div class="actions"><button class="primary" onclick="step=2;render()">查看 FAQ 修改建议 →</button><button onclick="step=0;filter='other';selected=42;render()">核查其余 8 条</button></div>`:''}`}
function fix(){return `<p class="step-note">只修改 FAQ-017 的充电说明；依据与其他参数保持可追溯。</p>${!s.analysis?'<div class="notice">请先在根因分析中生成模拟分析。</div>':`<div class="row between"><h2>FAQ-017 · 耳机 A 如何充电？</h2><span class="badge">草案 r${s.revision}</span></div><div class="grid"><div class="panel"><h3>− 修改前 / v1</h3><div class="diff-old">${OLD}</div></div><div class="panel"><h3>+ 修改后 / 草案 r${s.revision}</h3><div class="diff-new">${esc(s.draft)}</div></div></div><div class="panel"><h3>编辑修改建议</h3><p class="small">Diff 按 FAQ 段落替换展示。内容变更会撤销已有审批和验证结果。</p><textarea id="draft" ${s.released?'disabled':''}>${esc(s.draft)}</textarea><p class="small">修改依据：产品说明书 V2 · 第 12 页 §3.2 · 中国大陆型号 A</p><div class="actions"><button ${s.released?'disabled':''} onclick="saveDraft()">保存草案</button><button class="primary" ${s.released?'disabled':''} onclick="if(saveDraft()) {step=3;render()}">提交人工审批 →</button></div></div>`}`}
function saveDraft(){if(s.released)return false;let text=$('draft').value.trim();if(!text){toast('FAQ 内容不能为空。');return false}if(text!==s.draft){s.draft=text;s.revision++;invalidate();log(`保存草案 r${s.revision}；旧审批与验证已失效`)}render();return true}
function approval(){return `<p class="step-note">审批绑定草案版本；批准后仍需通过模拟回归，才能模拟发布。</p>${!s.analysis?'<div class="notice">请先生成根因分析与修复建议。</div>':`<div class="panel"><h2>人工审批 · 草案 r${s.revision}</h2><div class="diff-new">${esc(s.draft)}</div><p>依据：产品说明书 V2，第 12 页。预计影响：FAQ-017 检索路径；其余 8 条仍需排查。</p>${s.approved?`<div class="notice">已批准 r${s.approved} · ${esc(s.reviewer)}<br>${esc(s.reviewNote)}</div><button class="primary" onclick="step=4;render()">进入模拟回归 →</button>`:`<label for="reviewer">审批人（模拟身份）</label><input id="reviewer" type="text" value="林晓"><label for="reviewNote">审批意见</label><textarea id="reviewNote" placeholder="填写批准依据或退回修改原因"></textarea><label><input type="checkbox" id="check">已核对修改内容、适用型号及权威依据</label><div class="actions"><button class="primary" onclick="approve()">批准当前草案</button><button onclick="reject()">退回修改</button></div>`}</div>`}`}
function approve(){if(!s.analysis||s.cluster!=='已确认')return;let name=$('reviewer').value.trim(),note=$('reviewNote').value.trim();if(!name||!note||!$('check').checked)return toast('请填写审批人与意见，并确认核对依据。');s.approved=s.revision;s.reviewer=name;s.reviewNote=note;log(`人工批准 r${s.revision} · ${name}：${note}`);step=4;render()}
function reject(){let note=$('reviewNote').value.trim();if(!note)return toast('请填写退回原因。');invalidate();log('审批退回：'+note);step=2;render();toast('已退回修改；需要重新审批。')}
function verification(){let r=s.result;return `<p class="step-note">固定场景模拟 · 不调用模型、不执行真实测试、不连接生产系统；结果不代表实际修复效果。</p><div class="panel"><div class="row between"><h2>回归验证 / 草案 r${s.revision}</h2><span class="badge">${s.approved?'已审批 r'+s.approved:'尚未审批'}</span></div><p>发布门槛：目标问题 ≥95%（至少 19/20），邻近保护集 100%（10/10），两项必须同时满足。</p><div class="row"><select id="scenario" aria-label="模拟验证场景" onchange="changeScenario(this.value)" ${busy||s.released?'disabled':''}>${[['pass','全部通过'],['fail','目标验证失败'],['regression','邻近回归退化']].map(([v,t])=>`<option value="${v}" ${scenario===v?'selected':''}>固定模拟：${t}</option>`).join('')}</select><button class="primary" ${s.approved!==s.revision||busy||s.released?'disabled':''} onclick="run()">${busy?'模拟展示中…':'展示模拟验证结果'}</button></div><p class="small">${s.released?'当前展示发布前的模拟验证记录；已发布版本的验证场景已锁定。':'切换场景即清除旧结果，需重新展示结果才能发布。修改草案后需重新审批。'}</p>${r?`<div class="notice">${s.released?'发布前验证已通过 · 已模拟发布':meetsGate(r)?'验证通过 · 可模拟发布':r.neighbor<10?'回归退化 · 禁止发布':'目标验证失败 · 禁止发布'} · 模拟草案 r${r.rev}<br>目标问题：${r.target}/20 · ${r.target*5}%；邻近保护集：${r.neighbor}/10 · ${r.neighbor*10}%</div><div class="table-wrap"><table><thead><tr><th>模拟评测组</th><th>修改前</th><th>修改后</th><th>说明</th></tr></thead><tbody><tr><td>直接询问无线充电（10）</td><td>0/10</td><td>${r.target-10}/10</td><td>${r.target===20?'均答不支持 Qi':'2 条仍答支持 Qi'}</td></tr><tr><td>同义问法（10）</td><td>2/10</td><td>10/10</td><td>仅支持 USB-C</td></tr><tr><td>邻近保护集（10）</td><td>10/10</td><td>${r.neighbor}/10</td><td>${r.neighbor===10?'USB-C、型号 B 等未受影响':'型号 B 的 Qi 支持被错误否定'}</td></tr></tbody></table></div>${!meetsGate(r)?`<p>${r.neighbor<10?'模拟退化案例：型号 B 原本正确的无线充电回答被改错，即使目标问题通过也不能发布。':'模拟失败案例：“放在无线底座上能充电吗？”仍返回支持；目标通过率低于 95%。'}</p><button onclick="step=2;render()">返回 FAQ 修复</button>`:''}`:''}</div><div class="panel"><h2>发布与线上观察 <span class="badge">全部模拟</span></h2><p>当前版本：<strong>${s.released?'FAQ-017 v2（草案 r'+s.revision+'）':'FAQ-017 v1'}</strong>　<span class="badge">${status()}</span></p><p class="small">仅更新本机演示状态。历史会话与单条核验结果保留，问题簇不会因发布自动关闭。</p>${s.released?`<div class="notice">线上观察中（模拟）：${pending()} 条未核验案例待跟进，8 条非 FAQ 引用案例仍需独立追踪。本原型没有真实线上监控数据。</div><div class="actions"><button onclick="trackCases('pending')">继续核验未核验案例（${pending()}）</button><button onclick="trackCases('other')">追踪非 FAQ 引用案例（8）</button><button class="danger" onclick="rollback()">申请模拟回滚 v2 → v1</button></div>`:`<button class="primary" ${canPublish()?'':'disabled'} onclick="publish()">确认模拟发布 v2</button>${!canPublish()?'<p class="small">发布已锁定：需确认问题簇、审批当前草案并同时达到两项验证门槛。</p>':''}`}${s.rollback?'<p class="small">已回滚至 v1（模拟），可能重新引入历史错误。重新发布需重新审批和验证。</p>':''}</div><div class="panel"><h2>操作记录 <span class="small">本机模拟审计</span></h2>${s.logs.map(l=>`<div class="log"><span class="small">${esc(l.time)} · 演示操作员</span><br>${esc(l.text)}</div>`).join('')||'<p>暂无操作。</p>'}</div>`}
function changeScenario(value){scenario=value;s.result=null;save();render()}
function run(){if(s.approved!==s.revision||s.released||busy)return;const rev=s.revision,mode=scenario,token=++runToken;busy=true;s.result=null;save();render();setTimeout(()=>{if(token!==runToken)return;busy=false;if(s.revision!==rev||s.approved!==rev){render();return}s.result={...scenarios[mode],rev,scenario:mode};log(`模拟验证 r${rev}：${scenarios[mode].label}，目标 ${s.result.target}/20，邻近 ${s.result.neighbor}/10`);render()},700)}
function publish(){if(!canPublish())return;confirmAction('确认模拟发布 v1 → v2？','将演示 FAQ-017 从 v1 切换至当前已审批、达到双项门槛的 v2。发布后进入线上观察中，保留所有未核验与非 FAQ 案例。',()=>{if(!canPublish())return;s.released=true;s.rollback=false;log(`模拟发布 FAQ-017 v1 → v2，草案 r${s.revision}；进入线上观察中`);render()})}
function rollback(){if(!s.released)return;confirmAction('申请模拟回滚 · 第 1 / 2 步',`当前：FAQ-017 v2（草案 r${s.revision}）。目标：FAQ-017 v1。v1 含“支持 Qi”的历史错误；回滚可能重新引入历史问题。`,()=>{});$('modalFields').innerHTML='<label for="rollbackReason">回滚原因（必填）</label><textarea id="rollbackReason" placeholder="请说明观察到的问题和回滚依据"></textarea><p id="rollbackError" class="small" role="alert"></p>';$('modalConfirm').textContent='继续确认';$('modalConfirm').onclick=()=>{const reason=$('rollbackReason').value.trim();if(!reason){$('rollbackError').textContent='请填写回滚原因后继续。';$('rollbackReason').focus();return}$('modal').close();confirmAction('再次确认模拟回滚 · 第 2 / 2 步',`FAQ-017 v2（草案 r${s.revision}） → v1。原因：${reason}。回滚可能重新引入“支持 Qi”的历史问题；当前审批与验证将失效，核验和审计记录保留。`,()=>{if(!s.released)return;s.released=false;s.rollback=true;invalidate();log(`模拟回滚 FAQ-017 v2 → v1；原因：${reason}；已确认可能重新引入历史问题；审批与验证失效`);render()});$('modalConfirm').textContent='确认风险并模拟回滚'}}
function render(){$('app').innerHTML=page==='list'?list():header()+[evidence,analysis,fix,approval,verification][step]()+`<div class="footer">ServicePilot PRD V0.1 · 低保真交互原型 / 说明书、会话、AI 分析及回归结果均为模拟数据</div>`}
render();
</script>
</html>
